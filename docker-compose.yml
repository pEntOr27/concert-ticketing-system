version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://ticketing_user:ticketing_pass@mysql:3306/concert_ticketing
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-jwt-key-production
      - SESSION_SECRET=super-secret-session-key-production
      - DEMO_OTP_CODE=123456
      - ENABLE_DEMO_LOGIN=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.0
    container_name: ticketing_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: concert_ticketing
      MYSQL_USER: ticketing_user
      MYSQL_PASSWORD: ticketing_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ticketing_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    environment:
      - DATABASE_URL=mysql://ticketing_user:ticketing_pass@mysql:3306/concert_ticketing
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mysql
      - redis
    restart: always

volumes:
  mysql_data:
