name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: concert_ticketing_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run tsc

      - name: Run Database Migrations & Seed
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/concert_ticketing_test
        run: |
          npx prisma db push
          npm run db:seed

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/concert_ticketing_test
          REDIS_URL: redis://localhost:6379
        run: npm run test

      - name: Run Concurrency Double-Booking Test
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/concert_ticketing_test
          REDIS_URL: redis://localhost:6379
        run: npm run test:concurrency

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=critical

      - name: Build Next.js Application
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/concert_ticketing_test
        run: npm run build
